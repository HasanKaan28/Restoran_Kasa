<!doctype html>
<!--
  GitHub Pages front page. The site lives on its own address now (Vercel), apart from Market Kasa's
  hasankaan28.github.io. The web app stays at ./app/ here for registers already set up on this
  address; their data is kept by the browser per address.
-->
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restoran Kasa taşındı</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://restorankasa.vercel.app/" />
    <meta http-equiv="refresh" content="0; url=https://restorankasa.vercel.app/" />
    <script>
      location.replace('https://restorankasa.vercel.app/' + location.search + location.hash);
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6ecdc;
        color: #2a2420; font: 16px/1.5 system-ui, sans-serif; padding: 16px; text-align: center; }
      a { color: #a9432b; }
      @media (prefers-color-scheme: dark) { body { background: #1c1815; color: #ece3d6; } a { color: #db7c5e; } }
    </style>
  </head>
  <body>
    <p>
      Restoran Kasa'nın yeni adresi
      <a href="https://restorankasa.vercel.app/">restorankasa.vercel.app</a>.<br />
      Bu adreste kurulu kasalar <a href="./app/">buradan</a> açılmaya devam eder.
    </p>
  </body>
</html>
