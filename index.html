<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4EEE6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1C1815" />
    <meta name="description" content="Restoran Kasa: masa, adisyon, mutfak/bar ekranı ve kasa" />
    <!-- The theme chosen on this device (src/app/theme.ts), set before the first paint. The
         desktop app allows this script by its hash (electron/security.cjs): change both. -->
    <script>
      try {
        var theme = localStorage.getItem('rk.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Restoran Kasa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
